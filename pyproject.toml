[project]
name = "devbox"
version = "0.1.0"
description = "Temporary Hetzner development servers for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devbox = "devbox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
