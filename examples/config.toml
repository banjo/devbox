# ~/.config/devbox/config.toml
# Only hcloud_token_file is required.

hcloud_token_file = "~/.config/devbox/hcloud.token"

# Optional defaults for `devbox up` when --type/--location are not given.
# Without them, `up` uses the project's last server type and location.
# server_type = "cx23"
# location = "fsn1"

image = "ubuntu-24.04"
ssh_key = "~/.ssh/devbox"

# CIDRs allowed to SSH into devboxes. "auto" = this machine's public IPv4.
ssh_allow = ["auto"]

# Identifies this install in Hetzner labels and resource names. Generated and
# stored in ~/.local/state/devbox/controller-id when not set.
# controller_id = "my-laptop"

# Snapshots kept per project (older ones are deleted after a new one exists).
keep_snapshots = 1
# Fallback snapshot price if Hetzner's pricing API can't be read (EUR per GB per month).
# snapshot_price_per_gb_month = 0.012

# `devbox idle-check` (run from cron or the systemd timer) acts on servers
# without devbox activity for this long: "pause" (snapshot + delete) or "down".
idle_timeout = "8h"
idle_action = "pause"
# idle_timeout = "hour-end" instead stops idle servers just before their next
# billing hour starts (Hetzner bills per started hour). A server must be idle
# for min_idle first; billing_margin is the safety margin before the boundary.
# min_idle = "5m"
# billing_margin = "5m"

# Deadline for `up`: create/power on, SSH, cloud-init, tool check and first sync.
startup_timeout = "5m"

# Monthly spending limit in EUR. "warn" or "block" when `up` would exceed it.
# monthly_budget = 20
# budget_action = "warn"

# How many servers may run at once (one per project). When reached, `up` for
# another project refuses unless --additional is passed. 0 = no limit.
max_servers = 1

# Stable preview URLs (`devbox expose`): one Cloudflare tunnel per project and
# <project>.<domain> / <project>-<preview>.<domain>. The domain must be a zone in
# the token's Cloudflare account. Token permissions: Account > Cloudflare Tunnel >
# Edit, Zone > DNS > Edit. Without preview_domain, URLs are random trycloudflare.com.
# preview_domain = "example.com"
# cloudflare_token_file = "~/.config/devbox/cloudflare-token"
