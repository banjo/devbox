# ~/.config/devbox/config.toml
# Only hcloud_token_file is required. The other values are the defaults.

hcloud_token_file = "~/.config/devbox/hcloud.token"
server_type = "cx23"
location = "fsn1"
image = "ubuntu-24.04"
ssh_key = "~/.ssh/devbox"

# CIDRs allowed to SSH into devboxes. "auto" = this host's public IPv4.
ssh_allow = ["auto"]
