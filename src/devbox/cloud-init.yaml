#cloud-config
write_files:
  # Fail fast instead of retrying a stalled package mirror for a long time.
  - path: /etc/apt/apt.conf.d/99devbox-timeouts
    permissions: "0644"
    content: |
      Acquire::http::Timeout "20";
      Acquire::https::Timeout "20";
      Acquire::Retries "2";
  - path: /etc/profile.d/devbox.sh
    permissions: "0644"
    content: |
      export PATH="/root/.local/share/mise/shims:$PATH"
      export MISE_YES=1
      export MISE_TRUSTED_CONFIG_PATHS=/srv/app

runcmd:
  # Idempotent, because these run again when a server is restored from a snapshot.
  - mkdir -p /srv/app
  # Instead of cloud-init's package list, which runs `apt-get update` on every new instance, restores included.
  - |
    missing=""
    for p in build-essential ca-certificates curl git jq rsync unzip; do
      dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || missing="$missing $p"
    done
    if [ -n "$missing" ]; then
      apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y $missing || exit 1
    fi
  - command -v docker >/dev/null || curl -fsSL --connect-timeout 20 --max-time 120 --retry 2 https://get.docker.com | sh
  - command -v mise >/dev/null || curl -fsSL --connect-timeout 20 --max-time 120 --retry 2 https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh
  - |
    if ! command -v cloudflared >/dev/null; then
      curl -fsSL --connect-timeout 20 --max-time 120 --retry 2 -o /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$(dpkg --print-architecture).deb"
      dpkg -i /tmp/cloudflared.deb
      rm -f /tmp/cloudflared.deb
    fi
